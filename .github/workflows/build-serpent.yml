# Builds SERPENT on GitHub's Mac and produces Serpent-Mac-Installer (a .pkg that
# installs the VST3, AU and standalone app). Runs on every upload, or by hand from Actions.
name: Build Serpent

on:
  push:
    branches: [serpent]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Build (Apple Silicon + Intel)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release --target Serpent_VST3 Serpent_AU Serpent_Standalone --parallel 4

      - name: Make the installer
        run: |
          A=build/Serpent_artefacts/Release
          mkdir -p root/Library/Audio/Plug-Ins/VST3 root/Library/Audio/Plug-Ins/Components root/Applications
          cp -R "$A/VST3/Serpent.vst3"      root/Library/Audio/Plug-Ins/VST3/
          cp -R "$A/AU/Serpent.component"   root/Library/Audio/Plug-Ins/Components/
          cp -R "$A/Standalone/Serpent.app" root/Applications/
          for b in "root/Library/Audio/Plug-Ins/VST3/Serpent.vst3" \
                   "root/Library/Audio/Plug-Ins/Components/Serpent.component" \
                   "root/Applications/Serpent.app"; do
            codesign --force --deep --sign - "$b"
          done
          lipo -info "root/Library/Audio/Plug-Ins/VST3/Serpent.vst3/Contents/MacOS/Serpent"

          pkgbuild --analyze --root root comp.plist
          i=0; while /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" comp.plist 2>/dev/null; do i=$((i+1)); done

          mkdir -p scripts
          printf '#!/bin/sh\nkillall -9 AudioComponentRegistrar 2>/dev/null || true\nexit 0\n' > scripts/postinstall
          chmod +x scripts/postinstall

          pkgbuild --root root --component-plist comp.plist --scripts scripts \
                   --identifier com.synthetik.serpent --version 1.0 --install-location / \
                   "Serpent-Installer.pkg"

      - uses: actions/upload-artifact@v6
        with:
          name: Serpent-Mac-Installer
          path: Serpent-Installer.pkg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build (64-bit)
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --target Serpent_VST3 Serpent_Standalone --parallel 4

      - name: Make the installer
        shell: pwsh
        run: |
          $A = "build/Serpent_artefacts/Release"
          if (!(Test-Path "$A/VST3/Serpent.vst3")) { throw "VST3 missing" }
          if (!(Test-Path "$A/Standalone/Serpent.exe")) { throw "Standalone missing" }
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item -Recurse "$A/VST3/Serpent.vst3" stage/
          Copy-Item "$A/Standalone/Serpent.exe" stage/
          $iss = @'
          [Setup]
          AppId={{6E2B6C1A-5D3F-4B8E-9A71-53525054534B}
          AppName=Serpent
          AppVersion=1.0
          AppPublisher=Synthetik
          DefaultDirName={autopf}\Synthetik\Serpent
          DefaultGroupName=Synthetik
          DisableProgramGroupPage=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=admin
          OutputDir=out
          OutputBaseFilename=Serpent-Installer-Windows
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayName=Serpent by Synthetik

          [Files]
          Source: "stage\Serpent.vst3\*"; DestDir: "{commoncf64}\VST3\Serpent.vst3"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "stage\Serpent.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Serpent"; Filename: "{app}\Serpent.exe"
          Name: "{group}\Uninstall Serpent"; Filename: "{uninstallexe}"

          [UninstallDelete]
          Type: filesandordirs; Name: "{commoncf64}\VST3\Serpent.vst3"
          '@
          $iss | Set-Content -Encoding UTF8 serpent.iss
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc serpent.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item out/Serpent-Installer-Windows.exe

      - uses: actions/upload-artifact@v6
        with:
          name: Serpent-Windows-Installer
          path: out/Serpent-Installer-Windows.exe
